apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcprocess-deployment
  labels:
    app: orcprocess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orcprocess
  template:
    metadata:
      labels:
        app: orcprocess
    spec:
      serviceAccountName: my-app-sa
      containers:
        - name: orcprocess
          image: IMAGE_CORE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aws-secrets
                  key: AWS_SESSION_TOKEN
            - name: BUCKET_NAME
              value: "soat7-fiap-hackaton-2025"
            - name: NAMESPACE
              value: "hackaton-fiap-2025"
            - name: PROCESS_VIDEO
              value: "process-video"
            - name: PROCESS_VIDEO_IMAGE
              value: "737021845667.dkr.ecr.us-east-1.amazonaws.comprocess-image:1.0.0"
            - name: REDIS_MID_URL
              value: "http://redis-communication-service.default.svc.cluster.local"
            - name: REGION
              value: "us-east-1"
            - name: SHARED_DISK
              value: "/opt/app/shared/"
            - name: UPLOAD_IMAGE
              value: "upload-image"
            - name: UPLOAD_IMAGE_IMAGE
              value: "737021845667.dkr.ecr.us-east-1.amazonaws.comupload-s3:1.0.0"
            - name: UPLOAD_VIDEO
              value: "upload-video"
            - name: UPLOAD_VIDEO_IMAGE
              value: "737021845667.dkr.ecr.us-east-1.amazonaws.comupload-s3:1.0.0"
            - name: MAX_EXECUTION_PER_POD
              value: "2"